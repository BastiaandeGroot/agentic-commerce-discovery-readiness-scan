services:
  - type: web
    name: agentic-commerce-discovery-readiness-scan
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # De sleutel voor `/api/mapping`, de enige route die een model aanroept.
      # `sync: false` betekent: niet in deze repo, maar in het Render-dashboard
      # zetten. Zonder sleutel valt het koppelscherm terug op het model in de
      # browser en zegt dat erbij; de scan zelf raakt hem nooit aan.
      - key: ANTHROPIC_API_KEY
        sync: false
      # De sleutel van de uitvoerder die vragenbanken aanlevert. `sync: false`:
      # in het dashboard zetten, niet in deze repo.
      - key: BANK_EXECUTOR_KEY
        sync: false
      # Serverzijdig schrijven buiten row level security om; alleen de uitvoerder.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
